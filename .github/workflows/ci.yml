name: MoonBit quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon fmt && moon info && git diff --exit-code
      - run: moon check --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js --deny-warn
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: moon build --target js --release --deny-warn
      - run: node tools/rule-impact.mjs examples/rule-impact/control-plane.yaml
      - run: node tools/test-rule-impact.mjs --golden /tmp/rule-impact-ci.json
      - run: node tools/refresh-engines.mjs
      - run: node examples/run-upstream-integration.mjs
      - run: node tools/test-demo.mjs
      - run: node tools/test-cli.mjs
      - run: node tools/test-query-batch.mjs
      - run: node tools/test-inspector.mjs
      - run: node tools/test-reference.mjs --golden
      - run: node tools/robustness.mjs
      - run: node tools/benchmark.mjs
      - run: node examples/public-rule-expressions.mjs
      - run: moon run examples/portable-check --target js
      - run: moon run examples/portable-check --target wasm-gc
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: evidence/
